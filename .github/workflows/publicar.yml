name: Atualizar e publicar (GitHub Pages)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"   # segunda-feira, 06:00 de Brasília
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: Baixar dados da ANP e gerar o site
        run: python -m anp_mapa tudo --saida public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
