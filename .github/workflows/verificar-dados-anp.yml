# Teste manual: baixa os dados REAIS da ANP e mostra até que data os preços vão (não publica nada).
name: Verificar dados da ANP
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: Baixar e construir com dados reais
        env:
          SEM_API_COORDENADAS: "1"
        run: python -m anp_mapa tudo --pasta dados_anp --saida site_teste
      - name: Resumo
        run: |
          ls -la dados_anp
          python - <<'PY'
          import json
          r = json.load(open("site_teste/dados/resumo.json"))
          print({k: r[k] for k in r if k not in ("municipios", "ufs", "bandeiras")})
          PY
